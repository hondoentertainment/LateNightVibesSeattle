    <style>
      /* ─── Challenges page styles ─── */
      .challenges-header {
        text-align: center;
        padding: var(--space-xl) var(--space-lg) var(--space-lg);
        max-width: 800px;
        margin: 0 auto;
      }
      .challenges-title {
        font-size: var(--font-2xl);
        font-weight: 700;
        color: var(--color-text);
        margin: 0 0 var(--space-sm);
      }
      .challenges-subtitle {
        color: var(--color-text-secondary);
        font-size: var(--font-md);
        margin: 0 0 var(--space-lg);
      }
      .countdown-banner {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        background: rgba(43, 255, 134, 0.08);
        border: 1px solid rgba(43, 255, 134, 0.2);
        border-radius: 24px;
        padding: var(--space-sm) var(--space-lg);
        font-size: var(--font-sm);
        color: var(--color-accent);
        font-weight: 600;
      }
      .countdown-banner svg { flex-shrink: 0; }

      /* ─── Tabs ─── */
      .challenge-tabs {
        display: flex;
        gap: var(--space-sm);
        justify-content: center;
        padding: 0 var(--space-lg) var(--space-lg);
        max-width: 800px;
        margin: 0 auto;
      }
      .challenge-tab {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        color: var(--color-text-secondary);
        padding: var(--space-sm) var(--space-lg);
        border-radius: 20px;
        font-size: var(--font-sm);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        font-family: inherit;
      }
      .challenge-tab:hover { border-color: var(--color-accent); color: var(--color-text); }
      .challenge-tab.active {
        background: rgba(43, 255, 134, 0.12);
        border-color: var(--color-accent);
        color: var(--color-accent);
      }

      /* ─── Challenge cards ─── */
      .challenges-grid {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 var(--space-lg) var(--space-xl);
        display: grid;
        gap: var(--space-md);
      }
      .challenge-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: var(--space-lg);
        transition: border-color 0.15s ease;
      }
      .challenge-card:hover { border-color: rgba(43, 255, 134, 0.3); }
      .challenge-card.completed { border-color: rgba(43, 255, 134, 0.4); }
      .challenge-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: var(--space-sm);
      }
      .challenge-type-badge {
        font-size: var(--font-xs);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(43, 255, 134, 0.1);
        color: var(--color-accent);
      }
      .challenge-type-badge.exploration { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
      .challenge-type-badge.discovery { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
      .challenge-type-badge.social { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
      .challenge-type-badge.streak { background: rgba(239, 68, 68, 0.15); color: #f87171; }
      .challenge-type-badge.vibe { background: rgba(43, 255, 134, 0.15); color: var(--color-accent); }
      .challenge-xp {
        font-size: var(--font-sm);
        font-weight: 700;
        color: var(--color-accent);
        white-space: nowrap;
      }
      .challenge-title {
        font-size: var(--font-lg);
        font-weight: 700;
        color: var(--color-text);
        margin: 0 0 var(--space-xs);
      }
      .challenge-desc {
        font-size: var(--font-sm);
        color: var(--color-text-secondary);
        margin: 0 0 var(--space-md);
      }

      /* ─── Progress bar ─── */
      .progress-bar-wrap {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 6px;
        height: 8px;
        overflow: hidden;
        margin-bottom: var(--space-xs);
      }
      .progress-bar-fill {
        height: 100%;
        border-radius: 6px;
        background: var(--color-accent);
        transition: width 0.3s ease;
        min-width: 0;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: var(--font-xs);
        color: var(--color-text-muted);
      }

      /* ─── Claim button ─── */
      .btn-claim {
        margin-top: var(--space-md);
        width: 100%;
        padding: var(--space-sm) var(--space-lg);
        background: var(--color-accent);
        color: var(--color-bg);
        border: none;
        border-radius: 8px;
        font-size: var(--font-sm);
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.15s ease;
      }
      .btn-claim:hover { opacity: 0.85; }
      .btn-claim:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-claimed {
        margin-top: var(--space-md);
        width: 100%;
        padding: var(--space-sm) var(--space-lg);
        background: transparent;
        color: var(--color-accent);
        border: 1px solid rgba(43, 255, 134, 0.3);
        border-radius: 8px;
        font-size: var(--font-sm);
        font-weight: 600;
        font-family: inherit;
        cursor: default;
      }

      /* ─── Leaderboard ─── */
      .leaderboard-section {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 var(--space-lg) var(--space-xl);
      }
      .leaderboard-title {
        font-size: var(--font-lg);
        font-weight: 700;
        color: var(--color-text);
        margin: 0 0 var(--space-md);
      }
      .leaderboard-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .leaderboard-item {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        padding: var(--space-md) var(--space-lg);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 10px;
        margin-bottom: var(--space-sm);
      }
      .leaderboard-rank {
        font-size: var(--font-lg);
        font-weight: 700;
        color: var(--color-accent);
        min-width: 28px;
        text-align: center;
      }
      .leaderboard-name {
        flex: 1;
        font-size: var(--font-md);
        color: var(--color-text);
        font-weight: 600;
      }
      .leaderboard-score {
        font-size: var(--font-sm);
        color: var(--color-text-secondary);
        font-weight: 600;
      }

      /* ─── Empty states ─── */
      .empty-state {
        text-align: center;
        padding: var(--space-2xl);
        color: var(--color-text-muted);
        font-size: var(--font-md);
      }

      /* ─── History section ─── */
      .history-card {
        opacity: 0.7;
      }
      .history-card .challenge-title { color: var(--color-text-secondary); }

      /* ─── Mobile bottom padding ─── */
      .challenges-container {
        padding-bottom: var(--bottom-nav-offset);
      }

      @media (min-width: 600px) {
        .challenges-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
