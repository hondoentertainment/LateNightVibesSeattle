<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c12" />
    <title>Recommendations — Late Night Vibes Seattle</title>
    <meta name="description" content="Get personalized Seattle nightlife recommendations based on your favorite venues, vibes, and distance preferences." />
    <meta property="og:title" content="Venue Recommendations — Late Night Vibes Seattle" />
    <meta property="og:description" content="Get personalized Seattle nightlife recommendations based on your favorite venues and vibes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://late-night-vibes-seattle.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Late Night Vibes Seattle — personalized venue recommendations" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon-512.png" />
    <link rel="apple-touch-startup-image" href="splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px)" />
    <link rel="apple-touch-startup-image" href="splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px)" />
    <link rel="apple-touch-startup-image" href="splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px)" />
    <link rel="apple-touch-startup-image" href="splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px)" />
    <link rel="apple-touch-startup-image" href="splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px)" />
    <link rel="manifest" href="manifest.json" />
    <link rel="canonical" href="https://late-night-vibes-seattle.vercel.app/recommend.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="recommend.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header class="topbar" role="banner">
      <div class="brand">
        <img src="lnv-logo.png" alt="Late Night Vibes" class="header-logo" />
      </div>
      <nav class="top-actions desktop-only" aria-label="Main navigation">
        <a href="index.html" class="nav-pill">Browse Venues</a>
        <a href="planner.html" class="nav-pill">Night Plan</a>
        <a href="neighborhoods.html" class="nav-pill">Compare</a>
        <a href="index.html?view=saved" class="nav-pill">Saved</a>
        <a href="admin.html" class="nav-pill nav-admin" id="adminNavLinkRec">Admin</a>
      </nav>
    </header>

    <!-- Mobile controls inline -->
    <div class="rec-mobile-controls mobile-only">
      <label class="field">
        Starting venue
        <select id="venueSelect">
          <option value="">Pick a venue</option>
        </select>
      </label>
      <div class="rec-inline-fields">
        <label class="field">
          Max miles
          <input id="maxDistanceInput" type="number" min="0" step="0.5" value="6" />
        </label>
        <label class="field">
          Results
          <input id="resultCountInput" type="number" min="3" max="20" value="8" />
        </label>
      </div>
      <button id="surpriseMeBtn" class="btn-surprise" type="button">Surprise me</button>
      <label class="field">
        Context
        <button type="button" class="info-tooltip" aria-label="How does context affect results? Context adjusts vibe weighting — Date night favors upscale/romantic; Friends favors group-friendly/social" title="Adjusts vibe weighting — Date night favors upscale/romantic; Friends favors group-friendly/social">ⓘ</button>
        <select id="contextModeMobile" title="Adjusts vibe weighting — Date night favors upscale/romantic; Friends favors group-friendly/social">
          <option value="">General</option>
          <option value="date">Date night</option>
          <option value="friends">Friends</option>
          <option value="solo">Solo</option>
          <option value="after-concert">After concert</option>
          <option value="post-game">Post-game</option>
        </select>
      </label>
      <div class="sidebar-section" id="sourceCardMobile" style="display:none">
        <div class="sidebar-title">Starting From</div>
        <div id="sourceInfoMobile" class="source-info"></div>
      </div>
    </div>

    <div class="rec-layout">
      <aside class="rec-controls desktop-only">
        <div class="sidebar-section">
          <div class="sidebar-title">Find Similar Venues</div>
          <label class="field">
            Starting venue
            <select id="venueSelectDesktop">
              <option value="">Pick a venue</option>
            </select>
          </label>
          <label class="field">
            Max miles
            <input id="maxDistanceInputDesktop" type="number" min="0" step="0.5" value="6" inputmode="decimal" autocomplete="off" />
          </label>
      <label class="field">
        Number of results
        <input id="resultCountInputDesktop" type="number" min="3" max="20" value="8" inputmode="numeric" autocomplete="off" />
      </label>
      <button id="surpriseMeBtnDesktop" class="btn-surprise" type="button">Surprise me</button>
      <label class="field">
        Context
        <button type="button" class="info-tooltip" aria-label="How does context affect results? Context adjusts vibe weighting — Date night favors upscale/romantic; Friends favors group-friendly/social" title="Adjusts vibe weighting — Date night favors upscale/romantic; Friends favors group-friendly/social">ⓘ</button>
        <select id="contextMode" title="Adjusts vibe weighting — Date night favors upscale/romantic; Friends favors group-friendly/social">
          <option value="">General</option>
          <option value="date">Date night</option>
          <option value="friends">Friends</option>
          <option value="solo">Solo</option>
          <option value="after-concert">After concert</option>
          <option value="post-game">Post-game</option>
        </select>
      </label>
    </div>

        <div class="sidebar-section" id="sourceCard" style="display:none">
          <div class="sidebar-title">Starting From</div>
          <div id="sourceInfo" class="source-info"></div>
        </div>
      </aside>

      <main class="rec-results" id="main">
        <h1 class="sr-only">Get personalized venue recommendations</h1>
        <div class="rec-filter-bar">
          <input id="recSearchFilter" type="search" placeholder="Filter results by name, area, or vibe…" autocomplete="off" aria-label="Filter recommendation results" class="rec-search-input" />
        </div>
        <div id="recommendationGrid" class="rec-grid" aria-live="polite"></div>
      </main>
    </div>

    <!-- Bottom nav (mobile) -->
    <nav class="bottom-nav mobile-only" aria-label="Main navigation">
      <a href="index.html" class="bottom-nav-item" aria-label="Browse venues">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Browse</span>
      </a>
      <a href="recommend.html" class="bottom-nav-item active" aria-current="page" aria-label="For You recommendations">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>
        <span>For You</span>
      </a>
      <a href="planner.html" class="bottom-nav-item" aria-label="Night plan builder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path d="M12 6v6l4 2"/></svg>
        <span>Plan</span>
      </a>
      <a href="index.html?view=saved" class="bottom-nav-item" id="savedNavItem" aria-label="Saved venues">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        <span>Saved</span>
      </a>
      <a href="neighborhoods.html" class="bottom-nav-item" aria-label="Compare neighborhoods">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Compare</span>
      </a>
    </nav>

    <!-- Detail drawer (shared pattern from Browse) -->
    <div id="recDetailOverlay" class="detail-overlay"></div>
    <div id="recDetailDrawer" class="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="recDetailTitle">
      <div class="drawer-handle"></div>
      <div class="drawer-header">
        <span id="recDetailTitle" class="drawer-title"></span>
        <button id="recDetailClose" class="drawer-close" type="button" aria-label="Close venue details">&times;</button>
      </div>
      <div id="recDetailBody" class="detail-body"></div>
    </div>

    <script src="config.js"></script>
    <script src="lib/core.js"></script>
    <script src="lib/shared-nav.js"></script>
    <script>LNVNav.init({ page: "recommend", adminId: "adminNavLinkRec" });</script>
    <script src="lib/mobile-haptics.js"></script>
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
    </script>
    <script src="lib/user-preferences.js"></script>
    <script src="lib/features.js"></script>
    <script src="lib/crawl-history.js"></script>
    <script src="lib/detail-drawer.js"></script>
    <script>
      (function () {
        const cfg = window.LNV_CONFIG || {};
        const domain = cfg.plausibleDomain || "";
        if (!domain) return;
        const s = document.createElement("script");
        s.defer = true;
        s.dataset.domain = domain;
        s.src = "https://plausible.io/js/script.js";
        document.head.appendChild(s);
      })();
    </script>
    <script src="recommend.js"></script>
  </body>
</html>
