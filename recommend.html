<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c12" />
    <title>Recommendations — Late Night Vibes Seattle</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="recommend.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="lnv-logo.png" alt="Late Night Vibes" class="header-logo" />
      </div>
      <div class="top-actions desktop-only">
        <a href="index.html" class="nav-pill">Browse Venues</a>
        <a href="admin.html" class="nav-pill">Admin</a>
      </div>
    </header>

    <!-- Mobile controls inline -->
    <div class="rec-mobile-controls mobile-only">
      <label class="field">
        Starting venue
        <select id="venueSelect">
          <option value="">Pick a venue</option>
        </select>
      </label>
      <div class="rec-inline-fields">
        <label class="field">
          Max miles
          <input id="maxDistanceInput" type="number" min="0" step="0.5" value="6" />
        </label>
        <label class="field">
          Results
          <input id="resultCountInput" type="number" min="3" max="20" value="8" />
        </label>
      </div>
      <label class="field">
        Context
        <select id="contextModeMobile">
          <option value="">General</option>
          <option value="date">Date night</option>
          <option value="friends">Friends</option>
          <option value="solo">Solo</option>
          <option value="after-concert">After concert</option>
          <option value="post-game">Post-game</option>
        </select>
      </label>
      <div class="sidebar-section" id="sourceCardMobile" style="display:none">
        <div class="sidebar-title">Starting From</div>
        <div id="sourceInfoMobile" class="source-info"></div>
      </div>
    </div>

    <div class="rec-layout">
      <aside class="rec-controls desktop-only">
        <div class="sidebar-section">
          <div class="sidebar-title">Find Similar Venues</div>
          <label class="field">
            Starting venue
            <select id="venueSelectDesktop">
              <option value="">Pick a venue</option>
            </select>
          </label>
          <label class="field">
            Max distance from anchor (miles)
            <input id="maxDistanceInputDesktop" type="number" min="0" step="0.5" value="6" />
          </label>
      <label class="field">
        Number of results
        <input id="resultCountInputDesktop" type="number" min="3" max="20" value="8" />
      </label>
      <label class="field">
        Context
        <select id="contextMode">
          <option value="">General</option>
          <option value="date">Date night</option>
          <option value="friends">Friends</option>
          <option value="solo">Solo</option>
          <option value="after-concert">After concert</option>
          <option value="post-game">Post-game</option>
        </select>
      </label>
    </div>

        <div class="sidebar-section" id="sourceCard" style="display:none">
          <div class="sidebar-title">Starting From</div>
          <div id="sourceInfo" class="source-info"></div>
        </div>
      </aside>

      <main class="rec-results">
        <div id="recommendationGrid" class="rec-grid"></div>
      </main>
    </div>

    <!-- Bottom nav (mobile) -->
    <nav class="bottom-nav mobile-only">
      <a href="index.html" class="bottom-nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Browse</span>
      </a>
      <a href="recommend.html" class="bottom-nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>
        <span>For You</span>
      </a>
      <a href="planner.html" class="bottom-nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path d="M12 6v6l4 2"/></svg>
        <span>Plan</span>
      </a>
      <a href="index.html?view=saved" class="bottom-nav-item" id="savedNavItem">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        <span>Saved</span>
      </a>
      <a href="neighborhoods.html" class="bottom-nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Compare</span>
      </a>
    </nav>

    <script src="config.js"></script>
    <script src="lib/core.js"></script>
    <script src="lib/features.js"></script>
    <script src="lib/crawl-history.js"></script>
    <script>
      (function () {
        const cfg = window.LNV_CONFIG || {};
        const domain = cfg.plausibleDomain || "";
        if (!domain) return;
        const s = document.createElement("script");
        s.defer = true;
        s.dataset.domain = domain;
        s.src = "https://plausible.io/js/script.js";
        document.head.appendChild(s);
      })();
    </script>
    <script src="recommend.js"></script>
  </body>
</html>
