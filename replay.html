          <div class="replay-empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </div>
          <p class="replay-empty-title">No replay yet</p>
          <p class="replay-empty-desc">Pick a date and hit "Generate Replay" to relive your night out. You need to mark venues as "Been There" first!</p>
