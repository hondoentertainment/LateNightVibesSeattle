<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c12" />
    <title>Late Night Vibes — Choose Your City</title>
    <meta name="description" content="Discover nightlife in America's biggest cities. Choose a city to explore bars, clubs, and late-night spots." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon-512.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Late Night Vibes">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: #0b0d14;
        color: #e8e8e8;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem 1rem;
        border-bottom: 1px solid rgba(43, 255, 134, 0.08);
      }

      .header-logo {
        height: 36px;
        width: auto;
      }

      /* Hero */
      .hero {
        text-align: center;
        padding: 3rem 1.5rem 2rem;
      }

      .hero-title {
        font-size: 2.25rem;
        font-weight: 700;
        color: #e8e8e8;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
      }

      .hero-title span {
        color: #2bff86;
      }

      .hero-subtitle {
        font-size: 1.05rem;
        color: #93a1c6;
        font-weight: 400;
        max-width: 460px;
        margin: 0 auto;
        line-height: 1.5;
      }

      /* City Grid */
      .city-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1rem 1rem 3rem;
        max-width: 960px;
        margin: 0 auto;
      }

      @media (min-width: 520px) {
        .city-grid {
          grid-template-columns: repeat(2, 1fr);
          padding: 1.5rem 1.5rem 4rem;
        }
      }

      @media (min-width: 820px) {
        .city-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .hero-title {
          font-size: 2.75rem;
        }
      }

      /* City Card */
      .city-card {
        position: relative;
        background: #101520;
        border-radius: 14px;
        padding: 1.5rem;
        cursor: pointer;
        border: 1px solid rgba(147, 161, 198, 0.08);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .city-card:hover {
        transform: translateY(-3px);
        border-color: rgba(43, 255, 134, 0.25);
        box-shadow: 0 8px 30px rgba(43, 255, 134, 0.06);
      }

      .city-card.active {
        border-color: rgba(43, 255, 134, 0.35);
      }

      .city-card.active::after {
        content: 'LIVE';
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: #2bff86;
        color: #0b0d14;
        font-size: 0.65rem;
        font-weight: 700;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        letter-spacing: 0.05em;
      }

      .city-card.coming-soon {
        cursor: default;
      }

      .city-card.coming-soon:hover {
        transform: none;
        border-color: rgba(147, 161, 198, 0.08);
        box-shadow: none;
      }

      .city-card-overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 13, 20, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        z-index: 2;
      }

      .city-card-overlay span {
        background: rgba(147, 161, 198, 0.12);
        color: #93a1c6;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.35rem 0.85rem;
        border-radius: 6px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .city-name {
        font-size: 1.35rem;
        font-weight: 700;
        color: #e8e8e8;
        line-height: 1.2;
      }

      .city-state {
        font-size: 0.8rem;
        font-weight: 600;
        color: #2bff86;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .city-tagline {
        font-size: 0.85rem;
        color: #93a1c6;
        font-style: italic;
        margin-top: 0.15rem;
        line-height: 1.4;
      }

      .city-meta {
        display: flex;
        gap: 1rem;
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: #93a1c6;
      }

      .city-meta span {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .city-meta .dot {
        width: 4px;
        height: 4px;
        background: #93a1c6;
        border-radius: 50%;
        opacity: 0.5;
      }

      /* Region sections */
      .region-section {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 1rem;
      }

      .region-heading {
        font-size: 1.35rem;
        font-weight: 700;
        color: #2bff86;
        margin: 2rem 0 0.75rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid rgba(43, 255, 134, 0.12);
        letter-spacing: -0.01em;
      }

      .region-section .city-grid {
        padding: 0.5rem 0 1.5rem;
      }

      @media (min-width: 520px) {
        .region-section {
          padding: 0 1.5rem;
        }
        .region-section .city-grid {
          padding: 0.5rem 0 2rem;
        }
      }
    </style>
    <script defer data-domain="latenightvibes.co" src="https://plausible.io/js/script.js"></script>
    <script src="lib/analytics.js"></script>
  </head>
  <body>
    <header class="header">
      <img src="lnv-logo.png" alt="Late Night Vibes" class="header-logo" />
    </header>

    <section class="hero">
      <h1 class="hero-title">Late Night <span>Vibes</span></h1>
      <p class="hero-subtitle">Discover nightlife in America's biggest cities</p>
    </section>

    <div id="regionContainer"></div>

    <script src="lib/cities.js"></script>
    <script>
      (function () {
        var ACTIVE_CITIES = { seattle: true };

        var REGIONS = [
          { name: 'West Coast', slugs: ['seattle', 'san-francisco', 'san-jose', 'los-angeles', 'san-diego', 'portland', 'las-vegas', 'fresno'] },
          { name: 'Southwest', slugs: ['phoenix', 'tucson', 'mesa', 'albuquerque', 'denver'] },
          { name: 'Texas', slugs: ['houston', 'dallas', 'fort-worth', 'san-antonio', 'austin', 'el-paso'] },
          { name: 'Midwest', slugs: ['chicago', 'columbus', 'indianapolis', 'milwaukee', 'oklahoma-city', 'louisville'] },
          { name: 'Southeast', slugs: ['jacksonville', 'charlotte', 'nashville', 'memphis'] },
          { name: 'Northeast', slugs: ['new-york', 'philadelphia'] }
        ];

        var container = document.getElementById('regionContainer');

        function formatPop(n) {
          return n.toLocaleString('en-US');
        }

        function buildCard(city) {
          var isActive = !!ACTIVE_CITIES[city.slug];
          var card = document.createElement('div');
          card.className = 'city-card' + (isActive ? ' active' : ' coming-soon');

          var inner = '';

          if (!isActive) {
            inner += '<div class="city-card-overlay"><span>Coming Soon</span></div>';
          }

          inner +=
            '<div class="city-state">' + city.state + '</div>' +
            '<div class="city-name">' + city.name + '</div>' +
            '<div class="city-tagline">"' + city.tagline + '"</div>' +
            '<div class="city-meta">' +
              '<span>' + formatPop(city.population) + ' people</span>' +
              '<span class="dot"></span>' +
              '<span>' + city.neighborhoods.length + ' neighborhoods</span>' +
            '</div>';

          card.innerHTML = inner;

          if (isActive) {
            card.addEventListener('click', function () {
              LNVCities.setCity(city.slug);
              window.location.href = 'index.html?city=' + city.slug;
            });
          }

          return card;
        }

        REGIONS.forEach(function (region) {
          var section = document.createElement('div');
          section.className = 'region-section';

          var heading = document.createElement('h2');
          heading.className = 'region-heading';
          heading.textContent = region.name;
          section.appendChild(heading);

          var grid = document.createElement('div');
          grid.className = 'city-grid';

          region.slugs.forEach(function (slug) {
            var city = LNVCities.getCityBySlug(slug);
            if (city) {
              grid.appendChild(buildCard(city));
            }
          });

          section.appendChild(grid);
          container.appendChild(section);
        });
      })();
    </script>
  </body>
</html>
